name: "release"
on:
  pull_request:
    types: [closed]
    branches:
      - domin/master

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged
    outputs:
      RELEASE_VERSION: ${{ steps.tag_and_prepare_release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag and prepare release
        id: tag_and_prepare_release
        uses: K-Phoen/semver-release-action@v1.3.2
        with:
          release_branch: domin/master
          release_strategy: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set env variables
        run: |
          echo "RELEASE_VERSION=${{ steps.tag_and_prepare_release.outputs.tag }}" >> $GITHUB_ENV

      - name: Upload release notes
        if: steps.tag_and_prepare_release.outputs.tag
        uses: Roang-zero1/github-create-release-action@v3
        with:
          created_tag: ${{ steps.tag_and_prepare_release.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: prepare_release
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.RELEASE_VERSION }}
          release_name: Release ${{ needs.prepare_release.outputs.RELEASE_VERSION }}
          prerelease: false
